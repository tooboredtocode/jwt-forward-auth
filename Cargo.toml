[package]
name = "jwt-forward-auth"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }

this-state = "0.3"
arc-swap = "1.9"
dashmap = "6.2"

notify = "8.2.1"

futures-util = "0.3"
tokio = { version = "1.54", features = ["full"] }

axum = "0.8"
tower-layer = "0.3"
tower-http = { version = "0.7", features = ["normalize-path", "trace"] }
reqwest = { version = "0.13", features = ["json"] }
http = "1.5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
time = "0.3"

aliri = { version = "0.6", features = ["hmac", "rsa", "ec"] }
aliri_clock = "0.1"
